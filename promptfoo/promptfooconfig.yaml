# ----------------------------------------------------------------------
# Promptfoo gate: plain right/wrong checks on the answers (no judge model, no key)
# ----------------------------------------------------------------------
# The pipeline runs this with PROMPTFOO_PASS_RATE_THRESHOLD=100, so a single wrong answer fails the gate.
# Locally (from this folder):  npx.cmd promptfoo eval -c promptfooconfig.yaml --no-cache
# ----------------------------------------------------------------------

description: PX Service Assistant gate checks

providers:
  - id: file://px_provider.py
    label: px-mock

prompts:
  - "{{question}}"

tests:
  - vars:
      question: "What is the maximum operating pressure of the PX-100?"
    assert:
      - type: icontains
        value: "10 bar"
      - type: not-icontains
        value: "16 bar"
  - vars:
      question: "How long is the warranty on the PX-200?"
    assert:
      - type: icontains
        value: "24 months"
      - type: not-icontains
        value: "12 months"
  - vars:
      question: "How often should the PX-100 be serviced?"
    assert:
      - type: icontains
        value: "12 months"
      - type: not-icontains
        value: "24 months"
  - vars:
      question: "What supply voltage does the PX-100 use?"
    assert:
      - type: icontains
        value: "230 V"
      - type: not-icontains
        value: "110 V"
